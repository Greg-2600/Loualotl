<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Axolotl Lake Adventure</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a2e4a; font-family: "Comic Sans MS", "Trebuchet MS", Verdana, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; cursor: none; }
  #ui { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 22px; text-shadow: 2px 2px 4px #000; pointer-events: none; }
  .hint { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 15px; line-height: 1.35; text-shadow: 2px 2px 4px #000; text-align: center; pointer-events: none; max-width: calc(100vw - 440px); }
  #mutebtn, #ambbtn { position: fixed; right: 10px; z-index: 10; background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.5); color: #fff; font-family: inherit; font-size: 15px; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
  #mutebtn { top: 10px; }
  #ambbtn { top: 52px; }
  #mutebtn:hover, #ambbtn:hover { background: rgba(0,0,0,0.65); }
  /* keep the centred hint clear of the canvas HUD (left) and the buttons (right) */
  @media (max-width: 900px) { .hint { font-size: 13px; } }
  @media (max-width: 640px) {
    .hint { max-width: 92vw; font-size: 12px; }
    #mutebtn { top: auto; bottom: 46px; }
    #ambbtn { top: auto; bottom: 6px; }
    #mutebtn, #ambbtn { font-size: 12px; padding: 5px 10px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hint" id="hint">Move with mouse / touch / arrow keys &nbsp;•&nbsp; Eat food &nbsp;•&nbsp; Avoid rocks &amp; hungry fish &nbsp;•&nbsp; M mute &nbsp;•&nbsp; N water sounds</div>
<button id="mutebtn">🔊 Sound</button>
<button id="ambbtn">🌊 Ambience</button>
<div id="lakename" style="position:fixed;top:8px;left:50%;transform:translateX(-50%);color:#FFEB3B;font-size:24px;font-weight:bold;text-shadow:2px 2px 4px #000;pointer-events:none;text-align:center;white-space:nowrap;">Lake Xochililco</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize); resize();

// --- State ---
const keys = {};
window.addEventListener('keydown', e => {
  if (e.key.startsWith('Arrow')) { e.preventDefault(); keys[e.key] = true; }
  else keys[e.key] = true;
}, { capture: true });
window.addEventListener('keyup', e => { keys[e.key] = false; if (e.key.startsWith('Arrow')) e.preventDefault(); }, { capture: true });
// keep window focusable
canvas.setAttribute('tabindex','0');
canvas.focus();
window.focus();

let pointer = { x: W/2, y: H/2, active: false };
canvas.addEventListener('mousemove', e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; });
canvas.addEventListener('touchstart', e => { const t=e.touches[0]; pointer.x=t.clientX; pointer.y=t.clientY; pointer.active=true; }, {passive:true});
canvas.addEventListener('touchmove', e => { const t=e.touches[0]; pointer.x=t.clientX; pointer.y=t.clientY; pointer.active=true; e.preventDefault(); }, {passive:false});

// --- Sound: tiny cute synth (Web Audio, no assets) ---
let muted = false, ambientOn = true;
try { muted = localStorage.getItem('ax_muted') === '1'; } catch(_) {}
try { ambientOn = localStorage.getItem('ax_ambient') !== '0'; } catch(_) {}
let audioCtx = null, masterGain = null, ambientGain = null, ambientNodes = null;
function ensureAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : 1;
      masterGain.connect(audioCtx.destination);
      startAmbient(); // build the water bed once, respects ambientOn
    } catch(e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}
// browsers only unlock audio on a real gesture
['pointerdown','touchstart','keydown'].forEach(ev =>
  window.addEventListener(ev, () => ensureAudio(), { passive: true }));
// pause the water when the tab is hidden
document.addEventListener('visibilitychange', () => {
  if (!audioCtx) return;
  if (document.hidden) audioCtx.suspend().catch(()=>{});
  else audioCtx.resume().catch(()=>{});
});

// one blip: an oscillator with a slide and a soft envelope
function tone({ f0=600, f1=null, type='sine', dur=0.15, vol=0.25, delay=0, dest=null }) {
  const ac = ensureAudio();
  if (!ac || !masterGain) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(1, f0), t0);
  if (f1 !== null) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest || masterGain);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

// --- Ambience: a soft underwater bed (rumble + flow + lapping swells) ---
// brown noise for the deep rumble, white for the shimmer
function makeNoise(ac, seconds, brown=true) {
  const len = Math.floor(ac.sampleRate * seconds);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const white = Math.random()*2 - 1;
    if (brown) { last = (last + 0.02*white) / 1.02; d[i] = last * 3.5; }
    else d[i] = white * 0.6;
  }
  return buf;
}
function startAmbient() {
  const ac = audioCtx;
  if (!ac || !masterGain || ambientNodes) return;
  ambientGain = ac.createGain();
  ambientGain.gain.value = 0;
  ambientGain.connect(masterGain);

  const buf = makeNoise(ac, 4);

  // deep water rumble
  const rumble = ac.createBufferSource(); rumble.buffer = buf; rumble.loop = true;
  const rumbleHp = ac.createBiquadFilter(); rumbleHp.type = 'highpass'; rumbleHp.frequency.value = 80;
  const rumbleLp = ac.createBiquadFilter(); rumbleLp.type = 'lowpass'; rumbleLp.frequency.value = 460; rumbleLp.Q.value = 0.7;
  const rumbleGain = ac.createGain(); rumbleGain.gain.value = 0.09;
  rumble.connect(rumbleHp); rumbleHp.connect(rumbleLp); rumbleLp.connect(rumbleGain); rumbleGain.connect(ambientGain);

  // flowing water shimmer
  const flow = ac.createBufferSource(); flow.buffer = makeNoise(ac, 4, false); flow.loop = true;
  const flowBp = ac.createBiquadFilter(); flowBp.type = 'bandpass'; flowBp.frequency.value = 1100; flowBp.Q.value = 0.8;
  const flowGain = ac.createGain(); flowGain.gain.value = 0.04;
  flow.connect(flowBp); flowBp.connect(flowGain); flowGain.connect(ambientGain);

  // very slow swells = gentle lapping / drifting current
  const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.06;
  const lfoLp = ac.createGain(); lfoLp.gain.value = 160;   // sweeps the rumble filter
  lfo.connect(lfoLp); lfoLp.connect(rumbleLp.frequency);
  const lfoFlow = ac.createGain(); lfoFlow.gain.value = 0.02; // breathes the shimmer
  lfo.connect(lfoFlow); lfoFlow.connect(flowGain.gain);

  const t = ac.currentTime;
  rumble.start(t); flow.start(t); lfo.start(t);
  ambientGain.gain.linearRampToValueAtTime(ambientOn ? 1 : 0, t + 2.5); // slow fade-in
  ambientNodes = { rumble, flow, lfo };
}
// a little run of bubbles rising
function sBubbleStream() {
  const n = 2 + Math.floor(Math.random()*4);
  let d = 0;
  for (let i = 0; i < n; i++) {
    const f = 420 + Math.random()*520;
    tone({ f0: f, f1: f*(1.5 + Math.random()*0.9), dur: 0.07 + Math.random()*0.06,
           vol: 0.05 + Math.random()*0.05, delay: d, dest: ambientGain });
    d += 0.07 + Math.random()*0.13;
  }
}

// eat: rising pentatonic bloop, so munching feels like a little melody
const eatNotes = [523.25, 587.33, 659.25, 783.99, 880, 1046.5]; // C D E G A C
let eatIdx = 0;
function sEat() {
  const f = eatNotes[eatIdx++ % eatNotes.length];
  tone({ f0: f, f1: f*1.45, dur: 0.09, vol: 0.25 });
  tone({ f0: f*2, dur: 0.07, vol: 0.1, delay: 0.06 });
}
// ouch: little peep then a sad slide-whistle droop
function sHurt() {
  tone({ f0: 880, f1: 620, dur: 0.08, vol: 0.2 });
  tone({ f0: 440, f1: 130, type: 'triangle', dur: 0.35, vol: 0.28, delay: 0.06 });
  tone({ f0: 220, f1: 100, dur: 0.4, vol: 0.12, delay: 0.1 });
}
// sparkle pickup (green protein)
function sProtein() {
  [880, 1174.66, 1567.98].forEach((f, i) =>
    tone({ f0: f, dur: 0.09, vol: 0.16, delay: i*0.05 }));
}
// all grown back! happy rising arpeggio
function sHeal() {
  [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) =>
    tone({ f0: f, type: 'triangle', dur: 0.2, vol: 0.2, delay: i*0.09 }));
}
// soft pop when a fun fact appears
function sFact() {
  tone({ f0: 300, f1: 900, dur: 0.12, vol: 0.18 });
  tone({ f0: 1174.66, dur: 0.1, vol: 0.1, delay: 0.1 });
}
// glug-glug reaching the surface for air
function sGulp() {
  tone({ f0: 520, f1: 180, dur: 0.12, vol: 0.16 });
  tone({ f0: 380, f1: 140, dur: 0.14, vol: 0.12, delay: 0.11 });
}
// rare tiny bubble pop
function sPop() {
  tone({ f0: 700, f1: 1400, dur: 0.06, vol: 0.05, dest: ambientGain });
}

// mute controls
const muteBtn = document.getElementById('mutebtn');
function applyMute() {
  if (masterGain) masterGain.gain.value = muted ? 0 : 1;
  muteBtn.textContent = muted ? '🔇 Muted' : '🔊 Sound';
  try { localStorage.setItem('ax_muted', muted ? '1' : '0'); } catch(_) {}
}
function toggleMute() { muted = !muted; ensureAudio(); applyMute(); }
muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); muteBtn.blur(); });
window.addEventListener('keydown', e => { if ((e.key === 'm' || e.key === 'M') && !e.repeat) toggleMute(); });
applyMute();

// ambience controls
const ambBtn = document.getElementById('ambbtn');
function applyAmbient() {
  if (ambientGain && audioCtx) {
    const t = audioCtx.currentTime;
    ambientGain.gain.cancelScheduledValues(t);
    ambientGain.gain.setValueAtTime(ambientGain.gain.value, t);
    ambientGain.gain.linearRampToValueAtTime(ambientOn ? 1 : 0, t + 0.8); // gentle fade
  }
  ambBtn.textContent = ambientOn ? '🌊 Ambience' : '🌊 Ambience off';
  try { localStorage.setItem('ax_ambient', ambientOn ? '1' : '0'); } catch(_) {}
}
function toggleAmbient() { ambientOn = !ambientOn; ensureAudio(); applyAmbient(); }
ambBtn.addEventListener('click', e => { e.stopPropagation(); toggleAmbient(); ambBtn.blur(); });
window.addEventListener('keydown', e => { if ((e.key === 'n' || e.key === 'N') && !e.repeat) toggleAmbient(); });
applyAmbient();


// --- Game data ---
const ax = { x: W/2, y: H/2, tx: W/2, ty: H/2, vx:0, vy:0, angle:0, gillPhase:0, eaten:0, oxygen:100,
  limbs: { leftArm:true, rightArm:true, tail:true }, regenUntil:0, regenTarget:null, invuln:0 };
let foods = [];
let dangers = [];
let proteins = [];
let particles = [];
let bubbles = [];
const npcs = [];
for (let i=0;i<4;i++) npcs.push({ x: Math.random()*W, y: Math.random()*(H-120)+60, vx:(Math.random()-0.5)*80, vy:(Math.random()-0.5)*40, angle:0, gillPhase:Math.random()*10, limbs:{leftArm:true,rightArm:true,tail:true}, regenUntil:0, invuln:0, eaten:0, oxygen:100 });
let score = 0;
let factShown = false;
let facts = [
  "Axolotls are amphibians that stay underwater their whole lives!",
  "Axolotls can grow back a lost leg in just a few weeks!",
  "Their feathery gills help them breathe underwater.",
  "Axolotls only live in Lake Xochimilco, Mexico!",
  "Baby axolotls are called larvae and look like tiny tadpoles.",
];
let currentFact = facts[0];
let factTimer = 0;
let time = 0;
let inAir = false; // for the surface-gulp sound
let ambientBubbleTimer = 4 + Math.random()*6; // next little bubble stream

// --- Depth scenery: layers recede into blue haze for a sense of distance ---
// near plants (dark, big, sharp) sit in front of mid and far layers
const plants = [];
for (let i=0;i<12;i++) plants.push({ x: Math.random()*W, h: 60+Math.random()*120, phase: Math.random()*Math.PI*2 });

// mid-distance plants: smaller, thinner, tinted toward the water
const midPlants = [];
for (let i=0;i<11;i++) midPlants.push({ x: Math.random()*W, h: 45+Math.random()*80, phase: Math.random()*Math.PI*2 });

// far plants: tiny pale silhouettes, barely there
const farPlants = [];
for (let i=0;i<15;i++) farPlants.push({ x: Math.random()*W, h: 30+Math.random()*55, phase: Math.random()*Math.PI*2 });

// distant rounded boulders along the lake bed
const farRocks = [];
for (let i=0;i<7;i++) farRocks.push({ x: Math.random()*W, y: H - 10 - Math.random()*30, r: 40+Math.random()*70 });

// distant schools drifting slowly across the back
const bgFish = [];
for (let i=0;i<6;i++) {
  bgFish.push({
    x: Math.random()*W, y: 110 + Math.random()*Math.max(60, H-230),
    r: 7 + Math.random()*11,
    vx: (Math.random()<0.5?1:-1) * (0.15 + Math.random()*0.35),
    depth: 0.5 + Math.random()*0.5,       // 0.5 far .. 1 nearer
    phase: Math.random()*Math.PI*2
  });
}

// drifting "marine snow" — far specks behind everything, near blobs in front
function makeSnow(n, minY, maxY, depth) {
  const out = [];
  for (let i=0;i<n;i++) out.push({
    x: Math.random()*W, y: minY + Math.random()*(maxY-minY),
    r: 0.6 + depth*2.2, vy: 4 + depth*14, phase: Math.random()*Math.PI*2,
    a: 0.05 + depth*0.16
  });
  return out;
}
const snowFar = makeSnow(30, 0, H, 0.15);
const snowNear = makeSnow(16, 0, H, 1);

// soft shafts of surface light
const rays = [];
for (let i=0;i<5;i++) rays.push({ x: Math.random()*W, w: 40+Math.random()*90, lean: (Math.random()-0.5)*0.5, phase: Math.random()*Math.PI*2 });

function spawnFood() {
  const types = ['worm','shrimp','insect'];
  const t = types[Math.floor(Math.random()*types.length)];
  foods.push({ x: Math.random()* (W-40)+20, y: Math.random()*(H-80)+40, type:t, r: 10, vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5 });
}
for (let i=0;i<6;i++) spawnFood();

// bright tropical reef colors for the fish
const FISH_COLORS = [
  { body:'#FFD93B', fin:'#FF9F1C' },                    // yellow tang
  { body:'#FF8A3D', fin:'#FFE066', stripe:'#FFFFFF' },  // clownfish
  { body:'#2E9BFF', fin:'#FFD93B' },                    // blue tang
  { body:'#FF4FA3', fin:'#FFC1E3' },                    // magenta
  { body:'#25E3E0', fin:'#0066FF' },                    // cyan
  { body:'#7CFF6B', fin:'#00B84D' },                    // parrot green
  { body:'#B76BFF', fin:'#FFD93B' },                    // purple
  { body:'#FF5A5A', fin:'#FFEB3B', stripe:'#FFFFFF' },  // coral red
];

function spawnDanger() {
  const fromLeft = Math.random() < 0.5;
  const x = fromLeft ? -60 : W + 60;
  const dir = fromLeft ? 1 : -1; // always swim inward
  if (Math.random() < 0.65) {
    // bias toward small fish, so giants feel special
    const r = 18 + Math.pow(Math.random(), 1.6) * 38; // 18 .. 56
    // small fish dart, big fish lumber
    const spd = Math.min(2.8, (42/r) * (0.9 + Math.random()*0.5));
    const c = FISH_COLORS[Math.floor(Math.random()*FISH_COLORS.length)];
    const top = r*1.15 + 30, bot = H - r*0.8 - 20; // keep fin + body on screen
    const y = top + Math.random()*Math.max(20, bot - top);
    dangers.push({
      x, y, r, type: 'fish', vx: spd * dir,
      body: c.body, fin: c.fin, stripe: c.stripe || null,
      wobble: Math.random()*Math.PI*2
    });
  } else {
    dangers.push({
      x, y: 80 + Math.random()*Math.max(30, H-170),
      r: 26 + Math.random()*14, type: 'rock',
      vx: 0.5 * dir
    });
  }
}
setInterval(spawnDanger, 4000);

function addParticles(x,y,color,n=8) {
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const s = 1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,r:2+Math.random()*3});
  }
}

function update(dt) {
  time += dt;
  // target from input
  let tx = ax.x, ty = ax.y;
  const arrowPressed = keys.ArrowLeft||keys.ArrowRight||keys.ArrowUp||keys.ArrowDown;
  if (arrowPressed) {
    if (keys.ArrowLeft) tx -= 200*dt;
    if (keys.ArrowRight) tx += 200*dt;
    if (keys.ArrowUp) ty -= 200*dt;
    if (keys.ArrowDown) ty += 200*dt;
  } else if (pointer.active) { tx = pointer.x; ty = pointer.y; }
  // clamp
  tx = Math.max(30, Math.min(W-30, tx));
  ty = Math.max(30, Math.min(H-30, ty));
  ax.tx = tx; ax.ty = ty;
  // move toward target
  const dx = tx-ax.x, dy=ty-ax.y;
  const dist = Math.hypot(dx,dy);
  const speed = 180;
  if (dist>2) {
    const step = Math.min(dist, speed*dt);
    ax.x += (dx/dist)*step; ax.y += (dy/dist)*step;
    ax.angle = Math.atan2(dy,dx);
  }
  ax.gillPhase += dt*6;

  // oxygen
  if (ax.y < 55) { // surface gulp (air zone)
    if (!inAir) { sGulp(); inAir = true; }
    ax.oxygen = Math.min(100, ax.oxygen + 40*dt);
  } else {
    inAir = false;
    ax.oxygen = Math.max(0, ax.oxygen - 6*dt);
  }
  if (ax.oxygen < 20) ax.oxygen = 20; // never critical enough to hurt

  // invuln decay
  if (ax.invuln>0) ax.invuln -= dt;

  // regen
  if (ax.regenUntil > 0) {
    ax.regenUntil -= dt;
    if (ax.regenUntil <= 0) {
      // restore all limbs
      ax.limbs = {leftArm:true,rightArm:true,tail:true};
      addParticles(ax.x, ax.y, '#7CFC00', 20);
      sHeal();
    }
  }

  // proteins spawn during regen
  if (ax.regenUntil > 0 && proteins.length < 5) {
    if (Math.random() < 0.05) {
      proteins.push({ x: ax.x + (Math.random()-0.5)*200, y: ax.y + (Math.random()-0.5)*200, r:12, life:6 });
    }
  } else if (ax.regenUntil <= 0) {
    // remove lingering proteins
    proteins = [];
  }

  // food
  foods.forEach(f => { f.x += f.vx; f.y += f.vy; if (f.x<20||f.x>W-20) f.vx*=-1; if (f.y<40||f.y>H-40) f.vy*=-1; });
  // eat check
  foods = foods.filter(f => {
    const d = Math.hypot(f.x-ax.x, f.y-ax.y);
    if (d < 28) {
      score++;
      ax.eaten++;
      addParticles(f.x, f.y, '#FFD700', 12);
      sEat();
      if (ax.eaten % 10 === 0) {
        currentFact = facts[Math.floor(Math.random()*facts.length)];
        factTimer = 5;
        sFact();
      }
      if (foods.length < 6) spawnFood();
      return false;
    }
    return true;
  });

  // proteins collect
  proteins = proteins.filter(p => {
    const d = Math.hypot(p.x-ax.x, p.y-ax.y);
    if (d < 24) {
      ax.regenUntil = Math.max(0, ax.regenUntil - 1.5);
      addParticles(p.x, p.y, '#00FFAA', 10);
      sProtein();
      return false;
    }
    p.life -= dt;
    return p.life > 0;
  });

  // dangers
  dangers.forEach(d => {
    d.x += d.vx;
    if (d.type === 'fish') {
      d.y += Math.sin(time*1.5 + d.wobble) * 0.3; // gentle bob
      const top = d.r*1.15 + 26, bot = H - d.r*0.8 - 12;
      d.y = Math.max(top, Math.min(Math.max(top, bot), d.y));
    }
  });
  dangers = dangers.filter(d => d.x > -80 && d.x < W+80);

  // collision with danger
  if (ax.invuln <= 0 && ax.regenUntil <= 0) {
    for (const d of dangers) {
      const dist = Math.hypot(d.x-ax.x, d.y-ax.y);
      if (dist < d.r + 18) {
        // lose a limb
        if (ax.limbs.leftArm) ax.limbs.leftArm = false;
        else if (ax.limbs.rightArm) ax.limbs.rightArm = false;
        else if (ax.limbs.tail) ax.limbs.tail = false;
        else { ax.limbs = {leftArm:false,rightArm:false,tail:false}; }
        ax.regenUntil = 5;
        ax.invuln = 1.5;
        addParticles(ax.x, ax.y, '#FF69B4', 24);
        sHurt();
        d.x = -9999; // remove
        break;
      }
    }
  }

  // bubbles
  if (Math.random() < 0.05) {
    bubbles.push({x:Math.random()*W, y:H+10, s:2+Math.random()*4, vy:-(0.5+Math.random()*1.5)});
    if (Math.random() < 0.08) sPop(); // rare tiny pop
  }
  // ambient bubble streams every so often
  ambientBubbleTimer -= dt;
  if (ambientBubbleTimer <= 0) {
    if (ambientOn) sBubbleStream();
    ambientBubbleTimer = 6 + Math.random()*11;
  }
  bubbles.forEach(b=>{b.y+=b.vy; b.x+=Math.sin(time+b.y*0.01)*0.3;});
  bubbles = bubbles.filter(b=>b.y>-20);

  // particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life-=dt*0.8;});
  particles = particles.filter(p=>p.life>0);

  // depth scenery drift
  bgFish.forEach(f => {
    f.x += f.vx;
    if (f.x < -60) f.x = W + 40;
    if (f.x > W + 60) f.x = -40;
  });
  const driftSnow = (arr, d) => {
    for (const s of arr) {
      s.y += s.vy*dt*0.25;
      s.x += Math.sin(time*0.6 + s.phase) * d;
      if (s.y > H+6) { s.y = -6; s.x = Math.random()*W; }
    }
  };
  driftSnow(snowFar, 0.05);
  driftSnow(snowNear, 0.12);

  // npc swim
  npcs.forEach(n => {
    n.x += n.vx*dt; n.y += n.vy*dt; n.gillPhase += dt*6;
    if (n.x<40||n.x>W-40) n.vx*=-1;
    if (n.y<40||n.y>H-40) n.vy*=-1;
    n.angle = Math.atan2(n.vy,n.vx);
    if (Math.random()<0.01){ n.vx += (Math.random()-0.5)*20; n.vy += (Math.random()-0.5)*20; }
  });
  if (factTimer>0) factTimer -= dt;
}

function drawAxolotl(a) {
  if (!a) a = ax;
  const {x,y,angle,limbs,gillPhase} = a;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  // body
  ctx.fillStyle = '#FFB6C1';
  ctx.beginPath();
  ctx.ellipse(0,0,34,20,0,0,Math.PI*2);
  ctx.fill();
  // tail
  if (limbs.tail) {
    ctx.fillStyle = '#FFC0CB';
    ctx.beginPath();
    ctx.moveTo(-28,0);
    ctx.quadraticCurveTo(-55, -12, -70, 0);
    ctx.quadraticCurveTo(-55, 12, -28, 0);
    ctx.fill();
  } else if (a.regenUntil>0) {
    // stub growing
    const t = 1 - a.regenUntil/5;
    ctx.fillStyle = '#FFC0CB';
    ctx.beginPath();
    ctx.ellipse(-30,0, 6+4*t, 4, 0,0,Math.PI*2);
    ctx.fill();
  }
  // legs
  const drawLeg = (side) => {
    ctx.fillStyle = '#FF69B4';
    ctx.beginPath();
    ctx.ellipse(8, side*16, 10, 6, 0,0,Math.PI*2);
    ctx.fill();
    // toes
    for (let i=0;i<3;i++){
      ctx.beginPath();
      ctx.arc(16, side*(12+i*3), 2.5,0,Math.PI*2);
      ctx.fill();
    }
  };
  if (limbs.leftArm) drawLeg(-1); else if (a.regenUntil>0){ ctx.fillStyle='#FF69B4'; ctx.beginPath(); ctx.arc(8,-16,4,0,Math.PI*2); ctx.fill(); }
  if (limbs.rightArm) drawLeg(1); else if (a.regenUntil>0){ ctx.fillStyle='#FF69B4'; ctx.beginPath(); ctx.arc(8,16,4,0,Math.PI*2); ctx.fill(); }
  // head
  ctx.fillStyle = '#FFB6C1';
  ctx.beginPath();
  ctx.ellipse(24,0,18,16,0,0,Math.PI*2);
  ctx.fill();
  // eyes
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(30,-6,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(30,6,4,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(31,-7,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(31,5,1.5,0,Math.PI*2); ctx.fill();
  // smile
  ctx.strokeStyle = '#c2185b'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(34,0,6,0.2,Math.PI-0.2); ctx.stroke();
  // gills (feathery external)
  for (let side=-1; side<=1; side+=2) {
    for (let i=0;i<3;i++){
      const wave = Math.sin(gillPhase + i + (side>0?0:1)) * 4;
      ctx.strokeStyle = '#E91E63';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(20, side*(8+i*3));
      ctx.quadraticCurveTo(32+wave, side*(12+i*3+wave), 38, side*(16+i*4));
      ctx.stroke();
      // tips
      ctx.fillStyle = '#F06292';
      ctx.beginPath();
      ctx.arc(38, side*(16+i*4), 3,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawFood(f) {
  if (f.type==='worm') {
    ctx.strokeStyle = '#B71C1C'; ctx.lineWidth=3;
    ctx.beginPath();
    // wiggly
    for (let i=0;i<8;i++){
      const a = (time*3 + i*0.6);
      const y = f.y + Math.sin(a)*3;
      if (i===0) ctx.moveTo(f.x + i*3, y); else ctx.lineTo(f.x + i*3, y);
    }
    ctx.stroke();
  } else if (f.type==='shrimp') {
    ctx.fillStyle = '#FFAB91';
    ctx.beginPath(); ctx.ellipse(f.x,f.y,9,5,Math.PI/4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#E64A19'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(f.x-7,f.y); ctx.lineTo(f.x-12,f.y-3); ctx.stroke();
  } else {
    // insect
    ctx.fillStyle='#4CAF50';
    ctx.beginPath(); ctx.ellipse(f.x,f.y,6,5,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#2E7D32'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(f.x-8,f.y); ctx.lineTo(f.x+8,f.y); ctx.stroke();
  }
}

function drawFish(d) {
  const r = d.r;
  const flip = d.vx < 0 ? -1 : 1;
  const wag = Math.sin(time*6 + (d.wobble || 0)) * 0.35;
  ctx.save();
  ctx.translate(d.x, d.y);
  ctx.scale(flip, 1); // face the way it swims

  // tail fin (wags as it swims)
  ctx.save();
  ctx.translate(-r*0.85, 0);
  ctx.rotate(wag);
  ctx.fillStyle = d.fin;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-r*0.5, -r*0.6, -r*0.9, -r*0.5);
  ctx.quadraticCurveTo(-r*0.55, 0, -r*0.9, r*0.5);
  ctx.quadraticCurveTo(-r*0.5, r*0.6, 0, 0);
  ctx.fill();
  ctx.restore();

  // dorsal fin (pokes up above the body)
  ctx.fillStyle = d.fin;
  ctx.beginPath();
  ctx.moveTo(-r*0.4, -r*0.3);
  ctx.quadraticCurveTo(0, -r*1.0, r*0.38, -r*0.28);
  ctx.quadraticCurveTo(0, -r*0.45, -r*0.4, -r*0.3);
  ctx.fill();

  // body
  ctx.fillStyle = d.body;
  ctx.beginPath();
  ctx.ellipse(0, 0, r, r*0.62, 0, 0, Math.PI*2);
  ctx.fill();

  // stripes, clipped to the body
  if (d.stripe) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r*0.62, 0, 0, Math.PI*2);
    ctx.clip();
    ctx.fillStyle = d.stripe;
    for (let i = 0; i < 3; i++) {
      const bx = -r*0.45 + i*r*0.55;
      ctx.beginPath();
      ctx.moveTo(bx - r*0.11, -r*0.7);
      ctx.lineTo(bx + r*0.11, -r*0.7);
      ctx.lineTo(bx + r*0.28, r*0.7);
      ctx.lineTo(bx + r*0.06, r*0.7);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // glossy highlight along the back
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath();
  ctx.ellipse(r*0.05, -r*0.24, r*0.68, r*0.2, 0, 0, Math.PI*2);
  ctx.fill();

  // pectoral fin, on top of the body
  ctx.save();
  ctx.translate(r*0.08, r*0.2);
  ctx.rotate(wag*1.6 + 0.35);
  ctx.fillStyle = d.fin;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.ellipse(0, 0, r*0.34, r*0.16, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();

  // eye
  const ex = r*0.56, ey = -r*0.1, er = Math.max(3, r*0.17);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(ex + er*0.2, ey, er*0.58, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ex + er*0.45, ey - er*0.32, er*0.22, 0, Math.PI*2); ctx.fill();

  // mouth, plus teeth on the big ones so they still read as trouble
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = Math.max(1.5, r*0.05);
  ctx.beginPath();
  ctx.arc(r*0.9, r*0.2, r*0.2, Math.PI*1.12, Math.PI*1.82);
  ctx.stroke();
  if (r > 36) {
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 3; i++) {
      const tx = r*0.6 + i*r*0.13;
      ctx.beginPath();
      ctx.moveTo(tx, r*0.02);
      ctx.lineTo(tx + r*0.08, r*0.02);
      ctx.lineTo(tx + r*0.04, r*0.2);
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.restore();
}

function draw() {
  // deep water: brighter at the surface, sinking into darkness below
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0.00,'#2E96DC');
  grad.addColorStop(0.30,'#1B76BC');
  grad.addColorStop(0.65,'#13598F');
  grad.addColorStop(1.00,'#0B3963');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // --- far distance: haze band, lake-bed silhouette, tiny plants, drifting schools ---
  // distant lake bed
  ctx.fillStyle = 'rgba(30,86,130,0.55)';
  ctx.beginPath();
  ctx.moveTo(0,H);
  for (let x=0; x<=W; x+=60) {
    ctx.lineTo(x, H - 26 - Math.sin(x*0.006)*16 - Math.sin(x*0.017)*9);
  }
  ctx.lineTo(W,H);
  ctx.closePath();
  ctx.fill();

  // distant rounded boulders
  farRocks.forEach(rk => {
    ctx.fillStyle = 'rgba(24,74,112,0.5)';
    ctx.beginPath();
    ctx.ellipse(rk.x, rk.y, rk.r, rk.r*0.6, 0, Math.PI, Math.PI*2);
    ctx.fill();
  });

  // far plants — pale blue silhouettes, faded but still readable
  ctx.strokeStyle = 'rgba(130,200,230,0.38)';
  farPlants.forEach(p => {
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x, H);
    for (let i=0;i<7;i++){
      const yy = H - i*(p.h/7);
      const xx = p.x + Math.sin(time*0.5 + p.phase + i*0.6)*5;
      ctx.lineTo(xx, yy);
    }
    ctx.stroke();
  });

  // distant fish schools, faded by distance
  bgFish.forEach(f => {
    const a = 0.12 + f.depth*0.2;
    const flip = f.vx < 0 ? -1 : 1;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.scale(flip, 1);
    ctx.fillStyle = `rgba(150,215,240,${a})`;
    ctx.beginPath();
    ctx.ellipse(0,0, f.r, f.r*0.5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath(); // tail
    ctx.moveTo(-f.r*0.8,0);
    ctx.lineTo(-f.r*1.6, -f.r*0.5);
    ctx.lineTo(-f.r*1.6, f.r*0.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  // shafts of surface light, breathing slowly
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  rays.forEach(r => {
    const a = 0.05 + 0.045*Math.sin(time*0.5 + r.phase);
    const g = ctx.createLinearGradient(0,0,0,H*0.9);
    g.addColorStop(0, `rgba(200,240,255,${Math.max(0,a)})`);
    g.addColorStop(0.55, `rgba(180,230,255,${Math.max(0,a*0.5)})`);
    g.addColorStop(1, 'rgba(180,230,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(r.x, 0);
    ctx.lineTo(r.x + r.w, 0);
    ctx.lineTo(r.x + r.w*2.1 + r.lean*260, H*0.95);
    ctx.lineTo(r.x - r.w*0.5 + r.lean*260, H*0.95);
    ctx.closePath();
    ctx.fill();
  });
  ctx.restore();

  // far marine snow
  snowFar.forEach(s => {
    ctx.fillStyle = `rgba(210,240,255,${s.a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });

  // depth haze: things fade toward the deep, so distance reads as depth
  const haze = ctx.createLinearGradient(0,0,0,H);
  haze.addColorStop(0,'rgba(8,40,72,0)');
  haze.addColorStop(0.55,'rgba(8,40,72,0.12)');
  haze.addColorStop(1,'rgba(4,26,50,0.42)');
  ctx.fillStyle = haze;
  ctx.fillRect(0,0,W,H);

  // air zone at top
  const airGrad = ctx.createLinearGradient(0,0,0,60);
  airGrad.addColorStop(0,'rgba(173,216,230,0.9)');
  airGrad.addColorStop(1,'rgba(173,216,230,0)');
  ctx.fillStyle = airGrad;
  ctx.fillRect(0,0,W,60);
  // air label — left side of the air band so it never overlaps the centred title/hint
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.font='bold 13px "Comic Sans MS", Verdana';
  ctx.textAlign='left';
  ctx.fillText(W > 900 ? '▲ AIR — swim here to breathe' : '▲ AIR', 12, 30);

  // --- mid distance: teal plants ---
  midPlants.forEach(p => {
    ctx.strokeStyle = 'rgba(46,140,150,0.75)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p.x, H);
    for (let i=0;i<9;i++){
      const yy = H - i*(p.h/9);
      const xx = p.x + Math.sin(time*0.7 + p.phase + i*0.55)*7;
      ctx.lineTo(xx, yy);
    }
    ctx.stroke();
  });

  // --- near distance: the original bold plants ---
  plants.forEach(p => {
    ctx.strokeStyle = '#2E7D32'; ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(p.x, H);
    for (let i=0;i<10;i++){
      const yy = H - i* (p.h/10);
      const xx = p.x + Math.sin(time*0.8 + p.phase + i*0.5)*8;
      if (i===0) ctx.moveTo(p.x,H); else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
    // leaf
    ctx.fillStyle='#43A047';
    ctx.beginPath();
    ctx.ellipse(p.x + Math.sin(time*0.8+p.phase)*8, H-p.h, 12,6, Math.PI/4,0,Math.PI*2);
    ctx.fill();
  });

  // bubbles
  ctx.fillStyle='rgba(255,255,255,0.5)';
  bubbles.forEach(b=>{ctx.beginPath(); ctx.arc(b.x,b.y,b.s,0,Math.PI*2); ctx.fill();});

  // dangers
  dangers.forEach(d => {
    if (d.type==='rock') {
      ctx.fillStyle='#757575';
      ctx.beginPath(); ctx.moveTo(d.x-d.r,d.y+d.r*0.5);
      ctx.lineTo(d.x-d.r*0.5,d.y-d.r); ctx.lineTo(d.x+d.r*0.5,d.y-d.r*0.8);
      ctx.lineTo(d.x+d.r,d.y+d.r*0.5); ctx.lineTo(d.x,d.y+d.r); ctx.closePath(); ctx.fill();
      // sharp spikes
      ctx.fillStyle='#424242';
      ctx.beginPath(); ctx.moveTo(d.x,d.y-d.r*1.2); ctx.lineTo(d.x-4,d.y-d.r*0.5); ctx.lineTo(d.x+4,d.y-d.r*0.5); ctx.fill();
    } else {
      drawFish(d);
    }
  });

  // foods
  foods.forEach(drawFood);

  // proteins
  proteins.forEach(p => {
    const glow = 0.6+Math.sin(time*6)*0.4;
    ctx.fillStyle = `rgba(0,255,170,${glow})`;
    ctx.shadowColor='#00FFAA'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
  });

  // other axolotls
  npcs.forEach(n => drawAxolotl(n));
  // axolotl
  drawAxolotl();

  // particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  });

  // near marine snow, in front of everything — the closest layer
  snowNear.forEach(s => {
    ctx.fillStyle = `rgba(215,242,255,${s.a*0.9})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });

  // HUD (pushed below the air band so it never sits under the centred title/hint)
  const hudY = W <= 640 ? 150 : 76;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(10,hudY,200,60);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px "Comic Sans MS", Verdana';
  ctx.fillText('Food: ' + score, 20, hudY+30);
  // oxygen bar
  ctx.fillStyle = '#444'; ctx.fillRect(20,hudY+42,180,10);
  const oc = ax.oxygen>50?'#4CAF50':ax.oxygen>25?'#FFC107':'#F44336';
  ctx.fillStyle = oc; ctx.fillRect(20,hudY+42, (ax.oxygen/100)*180, 10);
  ctx.fillStyle='#fff'; ctx.font='12px Verdana'; ctx.fillText('Oxygen',20,hudY+38);

  // regen prompt (drawn below the HUD panel so it never collides with the title/hint)
  if (ax.regenUntil > 0) {
    const msg = 'Ouch! Collect green sparkles to heal faster!  ·  Healing: ' + Math.ceil(ax.regenUntil) + 's';
    let fs = 20;
    ctx.font = 'bold ' + fs + 'px "Comic Sans MS", Verdana';
    while (fs > 11 && ctx.measureText(msg).width > W - 40) { fs--; ctx.font = 'bold ' + fs + 'px "Comic Sans MS", Verdana'; }
    const barH = fs + 20, ry = hudY + 74;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, ry, W, barH);
    ctx.fillStyle = '#FFEB3B';
    ctx.textAlign = 'center';
    ctx.fillText(msg, W/2, ry + barH/2 + fs*0.36);
    ctx.textAlign = 'left';
  }

  // fact overlay
  if (factTimer > 0) {
    const alpha = Math.min(1, factTimer);
    ctx.fillStyle = `rgba(0,0,0,${0.6* (factTimer>0.5?1:factTimer*2)})`;
    ctx.fillRect(0, H/2-60, W, 120);
    ctx.fillStyle = '#FFEB3B';
    ctx.font = 'bold 26px "Comic Sans MS", Verdana';
    ctx.textAlign='center';
    ctx.fillText(currentFact, W/2, H/2);
    ctx.textAlign='left';
  }

  // bottom hint (shrinks to fit narrow screens)
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.fillRect(0,H-28,W,28);
  const hintText = W <= 640
    ? 'Eat food · Surface for air · You regenerate!'
    : 'Move to eat worms, shrimp & insects. Swim to the top for oxygen. You cannot die - you regenerate!';
  ctx.fillStyle='#fff';
  let hs = 14;
  ctx.font = hs+'px Verdana';
  while (hs > 9 && ctx.measureText(hintText).width > W-24) { hs--; ctx.font = hs+'px Verdana'; }
  ctx.textAlign='center';
  ctx.fillText(hintText, W/2, H-10);
  ctx.textAlign='left';
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
