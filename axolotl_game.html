  @media (max-width: 900px) { .hint { font-size: 13px; } }

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize); resize();

// --- State ---
const keys = {};
// letter keys come through lowercase unless shift/caps is on — store them
// lowercase too, so WASD always works
const normKey = e => e.key.length === 1 ? e.key.toLowerCase() : e.key;
window.addEventListener('keydown', e => {
  const k = normKey(e);
  if (k.startsWith('Arrow') || k === '1' || k === '2') { e.preventDefault(); keys[k] = true; }
  else keys[k] = true;
}, { capture: true });
window.addEventListener('keyup', e => { const k = normKey(e); keys[k] = false; if (k.startsWith('Arrow')) e.preventDefault(); }, { capture: true });
// keep window focusable
canvas.setAttribute('tabindex','0');
canvas.focus();
window.focus();

let pointer = { x: W/2, y: H/2, active: false };
let quickMove = null; // 'up' (key 1) or 'down' (key 2) — a held course until we arrive
canvas.addEventListener('mousemove', e => { pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true; });
canvas.addEventListener('touchstart', e => { const t=e.touches[0]; pointer.x=t.clientX; pointer.y=t.clientY; pointer.active=true; }, {passive:true});
canvas.addEventListener('touchmove', e => { const t=e.touches[0]; pointer.x=t.clientX; pointer.y=t.clientY; pointer.active=true; e.preventDefault(); }, {passive:false});
// keys 1 and 2: ride to the surface / dive to the bed. Direction keys take
// back control (handled in update); the mouse doesn't cancel it, or a resting
// hand would stop it from ever working on desktop.
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === '1') quickMove = 'up';
  if (k === '2') quickMove = 'down';
});

// --- Sound: tiny cute synth (Web Audio, no assets) ---
let muted = false, ambientOn = true;
try { muted = localStorage.getItem('ax_muted') === '1'; } catch(_) {}
try { ambientOn = localStorage.getItem('ax_ambient') !== '0'; } catch(_) {}
let audioCtx = null, masterGain = null, ambientGain = null, ambientNodes = null;
function ensureAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : 1;
      masterGain.connect(audioCtx.destination);
      startAmbient(); // build the water bed once, respects ambientOn
    } catch(e) { return null; }
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}
// browsers only unlock audio on a real gesture
['pointerdown','touchstart','keydown'].forEach(ev =>
  window.addEventListener(ev, () => ensureAudio(), { passive: true }));
// pause the water when the tab is hidden
document.addEventListener('visibilitychange', () => {
  if (!audioCtx) return;
  if (document.hidden) audioCtx.suspend().catch(()=>{});
  else audioCtx.resume().catch(()=>{});
});

// one blip: an oscillator with a slide and a soft envelope
function tone({ f0=600, f1=null, type='sine', dur=0.15, vol=0.25, delay=0, dest=null }) {
  const ac = ensureAudio();
  if (!ac || !masterGain) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(1, f0), t0);
  if (f1 !== null) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(dest || masterGain);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

// --- Ambience: a soft underwater bed (rumble + flow + lapping swells) ---
// brown noise for the deep rumble, white for the shimmer
function makeNoise(ac, seconds, brown=true) {
  const len = Math.floor(ac.sampleRate * seconds);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const white = Math.random()*2 - 1;
    if (brown) { last = (last + 0.02*white) / 1.02; d[i] = last * 3.5; }
    else d[i] = white * 0.6;
  }
  return buf;
}
function startAmbient() {
  const ac = audioCtx;
  if (!ac || !masterGain || ambientNodes) return;
  ambientGain = ac.createGain();
  ambientGain.gain.value = 0;
  ambientGain.connect(masterGain);

  const buf = makeNoise(ac, 4);

  // deep water rumble
  const rumble = ac.createBufferSource(); rumble.buffer = buf; rumble.loop = true;
  const rumbleHp = ac.createBiquadFilter(); rumbleHp.type = 'highpass'; rumbleHp.frequency.value = 80;
  const rumbleLp = ac.createBiquadFilter(); rumbleLp.type = 'lowpass'; rumbleLp.frequency.value = 460; rumbleLp.Q.value = 0.7;
  const rumbleGain = ac.createGain(); rumbleGain.gain.value = 0.09;
  rumble.connect(rumbleHp); rumbleHp.connect(rumbleLp); rumbleLp.connect(rumbleGain); rumbleGain.connect(ambientGain);

  // flowing water shimmer
  const flow = ac.createBufferSource(); flow.buffer = makeNoise(ac, 4, false); flow.loop = true;
  const flowBp = ac.createBiquadFilter(); flowBp.type = 'bandpass'; flowBp.frequency.value = 1100; flowBp.Q.value = 0.8;
  const flowGain = ac.createGain(); flowGain.gain.value = 0.04;
  flow.connect(flowBp); flowBp.connect(flowGain); flowGain.connect(ambientGain);

  // very slow swells = gentle lapping / drifting current
  const lfo = ac.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.06;
  const lfoLp = ac.createGain(); lfoLp.gain.value = 160;   // sweeps the rumble filter
  lfo.connect(lfoLp); lfoLp.connect(rumbleLp.frequency);
  const lfoFlow = ac.createGain(); lfoFlow.gain.value = 0.02; // breathes the shimmer
  lfo.connect(lfoFlow); lfoFlow.connect(flowGain.gain);

  const t = ac.currentTime;
  rumble.start(t); flow.start(t); lfo.start(t);
  ambientGain.gain.linearRampToValueAtTime(ambientOn ? 1 : 0, t + 2.5); // slow fade-in
  ambientNodes = { rumble, flow, lfo };
}
// a little run of bubbles rising
function sBubbleStream() {
  const n = 2 + Math.floor(Math.random()*4);
  let d = 0;
  for (let i = 0; i < n; i++) {
    const f = 420 + Math.random()*520;
    tone({ f0: f, f1: f*(1.5 + Math.random()*0.9), dur: 0.07 + Math.random()*0.06,
           vol: 0.05 + Math.random()*0.05, delay: d, dest: ambientGain });
    d += 0.07 + Math.random()*0.13;
  }
}

// eat: rising pentatonic bloop, so munching feels like a little melody
const eatNotes = [523.25, 587.33, 659.25, 783.99, 880, 1046.5]; // C D E G A C
let eatIdx = 0;
function sEat() {
  const f = eatNotes[eatIdx++ % eatNotes.length];
  tone({ f0: f, f1: f*1.45, dur: 0.09, vol: 0.25 });
  tone({ f0: f*2, dur: 0.07, vol: 0.1, delay: 0.06 });
}
// quiet bite for the other axolotls
function sNpcEat() {
  const f = 420 + Math.random()*220;
  tone({ f0: f, f1: f*1.3, dur: 0.07, vol: 0.09 });
}
// ouch: little peep then a sad slide-whistle droop
function sHurt() {
  tone({ f0: 880, f1: 620, dur: 0.08, vol: 0.2 });
  tone({ f0: 440, f1: 130, type: 'triangle', dur: 0.35, vol: 0.28, delay: 0.06 });
  tone({ f0: 220, f1: 100, dur: 0.4, vol: 0.12, delay: 0.1 });
}
// sparkle pickup (green protein)
function sProtein() {
  [880, 1174.66, 1567.98].forEach((f, i) =>
    tone({ f0: f, dur: 0.09, vol: 0.16, delay: i*0.05 }));
}
// all grown back! happy rising arpeggio
function sHeal() {
  [523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) =>
    tone({ f0: f, type: 'triangle', dur: 0.2, vol: 0.2, delay: i*0.09 }));
}
// soft pop when a fun fact appears
function sFact() {
  tone({ f0: 300, f1: 900, dur: 0.12, vol: 0.18 });
  tone({ f0: 1174.66, dur: 0.1, vol: 0.1, delay: 0.1 });
}
// glug-glug reaching the surface for air
function sGulp() {
  tone({ f0: 520, f1: 180, dur: 0.12, vol: 0.16 });
  tone({ f0: 380, f1: 140, dur: 0.14, vol: 0.12, delay: 0.11 });
}
// rare tiny bubble pop
function sPop() {
  tone({ f0: 700, f1: 1400, dur: 0.06, vol: 0.05, dest: ambientGain });
}

// mute controls
const muteBtn = document.getElementById('mutebtn');
function applyMute() {
  if (masterGain) masterGain.gain.value = muted ? 0 : 1;
  muteBtn.textContent = muted ? '🔇 Muted' : '🔊 Sound';
  try { localStorage.setItem('ax_muted', muted ? '1' : '0'); } catch(_) {}
}
function toggleMute() { muted = !muted; ensureAudio(); applyMute(); }
muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); muteBtn.blur(); });
window.addEventListener('keydown', e => { if ((e.key === 'm' || e.key === 'M') && !e.repeat) toggleMute(); });
applyMute();

// ambience controls
const ambBtn = document.getElementById('ambbtn');
function applyAmbient() {
  if (ambientGain && audioCtx) {
    const t = audioCtx.currentTime;
    ambientGain.gain.cancelScheduledValues(t);
    ambientGain.gain.setValueAtTime(ambientGain.gain.value, t);
    ambientGain.gain.linearRampToValueAtTime(ambientOn ? 1 : 0, t + 0.8); // gentle fade
  }
  ambBtn.textContent = ambientOn ? '🌊 Ambience' : '🌊 Ambience off';
  try { localStorage.setItem('ax_ambient', ambientOn ? '1' : '0'); } catch(_) {}
}
function toggleAmbient() { ambientOn = !ambientOn; ensureAudio(); applyAmbient(); }
ambBtn.addEventListener('click', e => { e.stopPropagation(); toggleAmbient(); ambBtn.blur(); });
window.addEventListener('keydown', e => { if ((e.key === 'n' || e.key === 'N') && !e.repeat) toggleAmbient(); });
applyAmbient();


// --- Game data ---
const ax = { x: W/2, y: H/2, tx: W/2, ty: H/2, vx:0, vy:0, angle:0, gillPhase:0, swim:0, tailPhase:0, flick:0, eaten:0, oxygen:100,
  limbs: { leftArm:true, rightArm:true, tail:true }, regenUntil:0, regenTarget:null, invuln:0,
  mouth:0, mouthHold:0, mouthOpen:false, speck: Math.random()*6.283,
  spin:0, spinRate:0, blowT: 1 + Math.random()*3 };
let foods = [];
let dangers = [];
let proteins = [];
let particles = [];
let bubbles = [];
const npcs = [];
for (let i=0;i<4;i++) npcs.push({ x: Math.random()*W, y: Math.random()*(H-120)+60, vx:(Math.random()-0.5)*80, vy:(Math.random()-0.5)*40, angle:0, gillPhase:Math.random()*10, swim:0, tailPhase:Math.random()*10, flick:0, limbs:{leftArm:true,rightArm:true,tail:true}, regenUntil:0, invuln:0, eaten:0, oxygen:40+Math.random()*60, think:Math.random()*0.5, mode:'wander', target:null, foodRef:null, inAir:false, mouth:0, mouthHold:0, mouthOpen:false, speck:Math.random()*6.283, spin:0, spinRate:0, blowT: Math.random()*5, playT:0, playKind:null, chaseRef:null });
let score = 0;
let factShown = false;
let facts = [
  // your favourites
  "Axolotls are amphibians that stay underwater their whole lives!",

let currentFact = facts[0];
let factTimer = 0;
let factClock = 120; // first timed fact after 2 minutes, then every 2 minutes
// show a fact, never the same one twice in a row
function showFact() {
  let f = currentFact;
  while (f === currentFact) f = facts[Math.floor(Math.random()*facts.length)];
  currentFact = f;
  factTimer = 5;
  sFact();
}
let time = 0;
let inAir = false; // for the surface-gulp sound
let lastNpcEat = 0; // throttles the others' bites so it never rattles like chewing

// Mouths open as they close in on food and stay open a beat after a bite —
// a single open/close, never a chewing loop. No teeth, ever.
function updateMouth(a, minFD, dt) {
  if (a.mouthHold > 0) a.mouthHold -= dt;
  if (!a.mouthOpen) { if (minFD < 46) a.mouthOpen = true; }
  else if (minFD > 64) a.mouthOpen = false;      // hysteresis, so it can't flutter
  const want = (a.mouthOpen || a.mouthHold > 0) ? 1 : 0;
  a.mouth += (want - a.mouth) * Math.min(1, dt*14);
  if (a.mouth < 0.01) a.mouth = 0;
}
function bite(a) { a.mouthHold = 0.3; a.mouthOpen = true; a.mouth = Math.max(a.mouth, 0.95); }

// --- Playful antics ------------------------------------------------
// Happy barrel-roll twirls, little puffs of bubbles from the snout, and
// burst-of-speed darts. Purely for charm — none of it affects the game.
function twirl(a, dur = 0.6) {
  if (a.spinRate) return;                       // one twirl at a time
  a.spinRate = (Math.random() < 0.5 ? -1 : 1) * (Math.PI*2) / dur;
  a.spin = 0;
}
function updateTwirl(a, dt) {
  if (!a.spinRate) return;
  a.spin += a.spinRate*dt;
  if (Math.abs(a.spin) >= Math.PI*2 - 0.02) { a.spin = 0; a.spinRate = 0; }
}
function blowBubbles(a, n = 3) {
  const ca = Math.cos(a.angle), sa = Math.sin(a.angle);
  for (let i=0;i<n;i++){
    const lx = 37 + Math.random()*6, ly = (Math.random()-0.5)*5; // at the snout
    bubbles.push({ x: a.x + lx*ca - ly*sa, y: a.y + lx*sa + ly*ca,
                   s: 1.4 + Math.random()*2.4, vy: -(0.5 + Math.random()*1.1) });
  }
}
let ambientBubbleTimer = 4 + Math.random()*6; // next little bubble stream

// --- Depth scenery: layers recede into blue haze for a sense of distance ---
// near plants (dark, big, sharp) sit in front of mid and far layers
const plants = [];
for (let i=0;i<12;i++) plants.push({ x: Math.random()*W, h: 60+Math.random()*120, phase: Math.random()*Math.PI*2 });

// mid-distance plants: smaller, thinner, tinted toward the water
const midPlants = [];
for (let i=0;i<11;i++) midPlants.push({ x: Math.random()*W, h: 45+Math.random()*80, phase: Math.random()*Math.PI*2 });

// far plants: tiny pale silhouettes, barely there
const farPlants = [];
for (let i=0;i<15;i++) farPlants.push({ x: Math.random()*W, h: 30+Math.random()*55, phase: Math.random()*Math.PI*2 });

// distant rounded boulders along the lake bed
const farRocks = [];
for (let i=0;i<7;i++) farRocks.push({ x: Math.random()*W, y: H - 10 - Math.random()*30, r: 40+Math.random()*70 });

// distant schools drifting slowly across the back
const bgFish = [];
for (let i=0;i<6;i++) {
  bgFish.push({
    x: Math.random()*W, y: 110 + Math.random()*Math.max(60, H-230),
    r: 7 + Math.random()*11,
    vx: (Math.random()<0.5?1:-1) * (0.15 + Math.random()*0.35),
    depth: 0.5 + Math.random()*0.5,       // 0.5 far .. 1 nearer
    phase: Math.random()*Math.PI*2
  });
}

// drifting "marine snow" — far specks behind everything, near blobs in front
function makeSnow(n, minY, maxY, depth) {
  const out = [];
  for (let i=0;i<n;i++) out.push({
    x: Math.random()*W, y: minY + Math.random()*(maxY-minY),
    r: 0.6 + depth*2.2, vy: 4 + depth*14, phase: Math.random()*Math.PI*2,
    a: 0.05 + depth*0.16
  });
  return out;
}
const snowFar = makeSnow(30, 0, H, 0.15);
const snowNear = makeSnow(16, 0, H, 1);

// soft shafts of surface light
const rays = [];
for (let i=0;i<5;i++) rays.push({ x: Math.random()*W, w: 40+Math.random()*90, lean: (Math.random()-0.5)*0.5, phase: Math.random()*Math.PI*2 });

function spawnFood() {

}

  { body:'#FF8A3D', fin:'#FFE066', stripe:'#FFFFFF' },  // clownfish

];

// Fixed speckle pattern for the axolotl's mottled skin [x, y, radius].
// Positions sit well inside the body/head silhouette and keep clear of the
// eyes and mouth; each axolotl jitters them slightly (see `speck`) so no two
// look alike. Drawn clipped to the body, so nothing can spill past the edge.
const SPECKLES = [
  [-17,-4,1.2],[-13,-6,1.0],[-8,-5,1.3],[-3,-7,1.0],[2,-6,1.2],[7,-8,1.1],[12,-9,1.3],
  [-15,2,1.0],[-10,4,1.2],[-4,5,1.0],[2,6,1.2],[8,6,1.0],[13,5,1.1],
  [-5,-2,0.9],[6,-1,0.9],[0,1,0.8],[10,2,0.9],[-9,0,0.9],
  [17,-10,1.0],[19,-9,1.1],[19,1,0.9],[15,7,1.0],
];

// toothless fish are harmless snacks — the axolotls (you *and* the others)
// hunt them down. Toothed fish are the ones that bite back.
const isSnackFish = d => d.type === 'fish' && !d.teeth;

function spawnDanger() {
  const fromLeft = Math.random() < 0.5;
  const x = fromLeft ? -60 : W + 60;
  const dir = fromLeft ? 1 : -1; // always swim inward
  // just fish now — the sharp, hard rocks are gone, so it's a friendlier lake
  // bias toward small fish, so giants feel special
  const r = 18 + Math.pow(Math.random(), 1.6) * 38; // 18 .. 56
  // big fish are meaner: teeth get likelier the larger the fish
  const teeth = Math.random() < 0.25 + (r/56) * 0.45;
  // small fish dart, big fish lumber — snack fish swim a touch slower, so
  // they're actually catchable
  let spd = Math.min(2.8, (42/r) * (0.9 + Math.random()*0.5));
  if (!teeth) spd *= 0.8;
  const c = FISH_COLORS[Math.floor(Math.random()*FISH_COLORS.length)];
  const top = r*1.15 + 30, bot = H - r*0.8 - 20; // keep fin + body on screen
  const y = top + Math.random()*Math.max(20, bot - top);
  dangers.push({
    x, y, r, type: 'fish', vx: spd * dir, teeth,
    body: c.body, fin: c.fin, stripe: c.stripe || null,
    wobble: Math.random()*Math.PI*2
  });
}
setInterval(spawnDanger, 4000); // toothless fish are snacks, so keep them coming

function addParticles(x,y,color,n=8) {
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2;
    const s = 1+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,r:2+Math.random()*3});
  }
}

function update(dt) {
  time += dt;
  // target from input
  let tx = ax.x, ty = ax.y;
  const dirPressed = keys.ArrowLeft||keys.ArrowRight||keys.ArrowUp||keys.ArrowDown||keys.w||keys.a||keys.s||keys.d;
  // "1" rides up to the air and holds there until you're topped off;
  // "2" dives for the lake bed — any other input takes back the wheel
  if (dirPressed) quickMove = null;
  if (quickMove === 'up' && ax.oxygen >= 100) quickMove = null;
  if (dirPressed) {
    if (keys.ArrowLeft  || keys.a) tx -= 200*dt;
    if (keys.ArrowRight || keys.d) tx += 200*dt;
    if (keys.ArrowUp    || keys.w) ty -= 200*dt;
    if (keys.ArrowDown  || keys.s) ty += 200*dt;
  } else if (quickMove) {
    // hold a steady course: y-only, easing x back to mid-lake
    ty = quickMove === 'up' ? 28 : H - 40;
    tx = ax.x + (W/2 - ax.x) * Math.min(1, dt*0.6);
    if (quickMove === 'down' && ax.y >= H - 44) quickMove = null; // touched down
  } else if (pointer.active) { tx = pointer.x; ty = pointer.y; }
  // clamp
  tx = Math.max(30, Math.min(W-30, tx));
  ty = Math.max(30, Math.min(H-30, ty));
  ax.tx = tx; ax.ty = ty;
  // move toward target — low oxygen makes you swim sluggish: full tilt at
  // 100, roughly half speed once you're down to the reserve (20)
  const dx = tx-ax.x, dy=ty-ax.y;
  const dist = Math.hypot(dx,dy);
  const speed = 180 * (0.5 + 0.5 * (ax.oxygen/100));
  const px0 = ax.x, py0 = ax.y;
  if (dist>2) {
    const step = Math.min(dist, speed*dt);
    ax.x += (dx/dist)*step; ax.y += (dy/dist)*step;
    ax.angle = Math.atan2(dy,dx);
  }
  // how hard are we swimming? 0 = drifting, 1 = full tilt
  const moved = dt > 0 ? Math.hypot(ax.x-px0, ax.y-py0)/dt : 0;
  ax.swim += (Math.min(1, moved/speed) - ax.swim) * Math.min(1, dt*8);
  ax.flick = Math.max(0, (ax.flick||0) - dt*1.6); // tail-flick impulse decays
  // gills beat faster and the tail flicks harder the more we swim
  ax.gillPhase += dt * (3 + ax.swim*16 + ax.flick*9);
  ax.tailPhase += dt * (2.5 + ax.swim*17 + ax.flick*16);

  // playful: a lazy tail swish and the odd happy twirl when idling, plus
  // little puffs of bubbles from the snout now and then
  updateTwirl(ax, dt);
  if (ax.swim < 0.1) {
    if (Math.random() < 0.006) ax.flick = Math.max(ax.flick, 0.7);
    if (Math.random() < 0.0015) twirl(ax, 0.8);
  }
  ax.blowT -= dt;
  if (ax.blowT <= 0) {
    ax.blowT = 3 + Math.random()*6;
    if (ax.swim < 0.5) blowBubbles(ax, 2 + (Math.random()*3|0));
  }

  // oxygen — drains slowly now: about 100 seconds from a full bar down to the
  // reserve, so a trip away from the surface costs a real decision
  if (ax.y < 55) { // surface gulp (air zone)
    if (!inAir) { sGulp(); inAir = true; }
    ax.oxygen = Math.min(100, ax.oxygen + 40*dt);
  } else {
    inAir = false;
    ax.oxygen = Math.max(0, ax.oxygen - 1.0*dt);
  }
  if (ax.oxygen < 20) ax.oxygen = 20; // never critical enough to hurt

  // invuln decay
  if (ax.invuln>0) ax.invuln -= dt;

  // regen
  if (ax.regenUntil > 0) {
    ax.regenUntil -= dt;
    if (ax.regenUntil <= 0) {
      // restore all limbs
      ax.limbs = {leftArm:true,rightArm:true,tail:true};
      addParticles(ax.x, ax.y, '#7CFC00', 20);
      sHeal();
    }
  }

  // proteins spawn during regen
  if (ax.regenUntil > 0 && proteins.length < 5) {
    if (Math.random() < 0.05) {
      proteins.push({ x: ax.x + (Math.random()-0.5)*200, y: ax.y + (Math.random()-0.5)*200, r:12, life:6 });
    }
  } else if (ax.regenUntil <= 0) {
    // remove lingering proteins
    proteins = [];
  }

  // food
  foods.forEach(f => { f.x += f.vx; f.y += f.vy; if (f.x<20||f.x>W-20) f.vx*=-1; if (f.y<40||f.y>H-40) f.vy*=-1; });
  // eat check
  foods = foods.filter(f => {
    const d = Math.hypot(f.x-ax.x, f.y-ax.y);
    if (d < 28) {
      score++;
      ax.eaten++;
      addParticles(f.x, f.y, '#FFD700', 12);
      sEat();
      ax.flick = 1; // happy little tail flick on every bite
      bite(ax);     // open up for the morsel
      if (ax.eaten % 5 === 0) { twirl(ax, 0.5); blowBubbles(ax, 4); } // extra-happy twirl
      if (ax.eaten % 10 === 0) showFact();
      return false;
    }
    return true;
  });

  // snack fish: the toothless ones are food — chomp them for score
  dangers = dangers.filter(d => {
    if (!isSnackFish(d)) return true;
    const dist = Math.hypot(d.x-ax.x, d.y-ax.y);
    if (dist < d.r + 16) {
      score++;
      ax.eaten++;
      addParticles(d.x, d.y, '#FFD700', 14);
      sEat();
      ax.flick = 1;
      bite(ax);
      if (ax.eaten % 5 === 0) { twirl(ax, 0.5); blowBubbles(ax, 4); }
      if (ax.eaten % 10 === 0) showFact();
      return false;
    }
    return true;
  });

  // mouth: open when food is close, then a beat after the bite
  let nearFoodD = Infinity;
  for (const f of foods) {
    const d = Math.hypot(f.x-ax.x, f.y-ax.y);
    if (d < nearFoodD) nearFoodD = d;
  }
  for (const d of dangers) {           // snack fish count as "food" for the mouth too
    if (!isSnackFish(d)) continue;
    const fd = Math.hypot(d.x-ax.x, d.y-ax.y);
    if (fd < nearFoodD) nearFoodD = fd;
  }
  updateMouth(ax, nearFoodD, dt);

  // proteins collect
  proteins = proteins.filter(p => {
    const d = Math.hypot(p.x-ax.x, p.y-ax.y);
    if (d < 24) {
      ax.regenUntil = Math.max(0, ax.regenUntil - 1.5);
      addParticles(p.x, p.y, '#00FFAA', 10);
      sProtein();
      return false;
    }
    p.life -= dt;
    return p.life > 0;
  });

  // dangers
  dangers.forEach(d => {
    d.x += d.vx;
    if (d.type === 'fish') {
      d.y += Math.sin(time*1.5 + d.wobble) * 0.3; // gentle bob
      const top = d.r*1.15 + 26, bot = H - d.r*0.8 - 12;
      d.y = Math.max(top, Math.min(Math.max(top, bot), d.y));
    }
  });
  dangers = dangers.filter(d => d.x > -80 && d.x < W+80);

  // collision with danger — only the toothed fish bite back; smooth,
  // toothless fish are food (handled above) and can never hurt you
  if (ax.invuln <= 0 && ax.regenUntil <= 0) {
    for (const d of dangers) {
      if (!d.teeth) continue;
      const dist = Math.hypot(d.x-ax.x, d.y-ax.y);
      if (dist < d.r + 18) {
        // lose a limb
        if (ax.limbs.leftArm) ax.limbs.leftArm = false;
        else if (ax.limbs.rightArm) ax.limbs.rightArm = false;
        else if (ax.limbs.tail) ax.limbs.tail = false;
        else { ax.limbs = {leftArm:false,rightArm:false,tail:false}; }
        ax.regenUntil = 5;
        ax.invuln = 1.5;
        addParticles(ax.x, ax.y, '#FF69B4', 24);
        sHurt();
        d.x = -9999; // remove
        break;
      }
    }
  }

  // bubbles
  if (Math.random() < 0.05) {
    bubbles.push({x:Math.random()*W, y:H+10, s:2+Math.random()*4, vy:-(0.5+Math.random()*1.5)});
    if (Math.random() < 0.08) sPop(); // rare tiny pop
  }
  // ambient bubble streams every so often
  ambientBubbleTimer -= dt;
  if (ambientBubbleTimer <= 0) {
    if (ambientOn) sBubbleStream();
    ambientBubbleTimer = 6 + Math.random()*11;
  }
  bubbles.forEach(b=>{b.y+=b.vy; b.x+=Math.sin(time+b.y*0.01)*0.3;});
  bubbles = bubbles.filter(b=>b.y>-20);

  // particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life-=dt*0.8;});
  particles = particles.filter(p=>p.life>0);

  // depth scenery drift
  bgFish.forEach(f => {
    f.x += f.vx;
    if (f.x < -60) f.x = W + 40;
    if (f.x > W + 60) f.x = -40;
  });
  const driftSnow = (arr, d) => {
    for (const s of arr) {
      s.y += s.vy*dt*0.25;
      s.x += Math.sin(time*0.6 + s.phase) * d;
      if (s.y > H+6) { s.y = -6; s.x = Math.random()*W; }
    }
  };
  driftSnow(snowFar, 0.05);
  driftSnow(snowNear, 0.12);

  // npc axolotls: they wander, chase food, and surface for air
  const npcNearPlayer = n => Math.hypot(n.x-ax.x, n.y-ax.y) < 420;
  npcs.forEach(n => {
    // breathe: oxygen drains underwater, refills at the surface
    if (n.y < 55) n.oxygen = Math.min(100, n.oxygen + 45*dt);
    else          n.oxygen = Math.max(0, n.oxygen - 3.5*dt);
    const inAirNow = n.y < 55;
    if (inAirNow && !n.inAir && npcNearPlayer(n)) sGulp(); // a little gulp as they surface
    n.inAir = inAirNow;

    // re-plan a few times a second
    n.think -= dt;
    if (n.think <= 0) {
      n.think = 0.35 + Math.random()*0.45;
      if (n.oxygen < 45) {
        // low on air — head up for a gulp
        n.mode = 'air'; n.foodRef = null; n.chaseRef = null;
        n.target = { x: Math.max(50, Math.min(W-50, n.x + (Math.random()-0.5)*200)), y: 32 };
      } else {
        // nearest morsel worth chasing? (worms, shrimp, insects — and the
        // toothless fish, which are safe to eat. only if it's close.)
        let best = null, bd = 190;
        for (const f of foods) {
          const d = Math.hypot(f.x-n.x, f.y-n.y);
          if (d < bd) { bd = d; best = f; }
        }
        for (const s of dangers) {
          if (!isSnackFish(s)) continue;
          const d = Math.hypot(s.x-n.x, s.y-n.y);
          if (d < bd) { bd = d; best = s; }
        }
        if (best) { n.mode = 'food'; n.foodRef = best; n.chaseRef = null; }
        else if (Math.random() < 0.5) {
          // nothing to eat — time to play!
          n.mode = 'play'; n.foodRef = null;
          const r = Math.random();
          if (r < 0.45) {                        // dart: a burst of zoomies
            n.playKind = 'dart'; n.playT = 0.55;
            n.target = { x: 60 + Math.random()*(W-120), y: 90 + Math.random()*Math.max(40, H-170) };
          } else if (r < 0.78) {                 // twirl: a happy barrel roll
            n.playKind = 'twirl'; n.playT = 0.8;
            n.target = { x: n.x + (Math.random()-0.5)*180, y: n.y + (Math.random()-0.5)*180 };
            twirl(n, 0.7);
          } else {                               // tag: chase a playmate
            n.playKind = 'tag'; n.playT = 1.8;
            const mates = npcs.filter(o => o !== n);
            const mate = mates[(Math.random()*mates.length)|0];
            n.chaseRef = mate; n.target = { x: mate.x, y: mate.y };
          }
        } else {
          n.mode = 'wander'; n.foodRef = null; n.chaseRef = null;
          if (!n.target || Math.hypot(n.target.x-n.x, n.target.y-n.y) < 70)
            n.target = { x: 60 + Math.random()*(W-120), y: 100 + Math.random()*Math.max(40, H-190) };
        }
      }
    }
    // keep chasing the morsel we picked (it may drift, or be eaten)
    if (n.mode === 'food') {
      const stillFood = n.foodRef && (foods.includes(n.foodRef) || dangers.includes(n.foodRef));
      if (!stillFood) { n.mode = 'wander'; n.foodRef = null; n.think = 0; }
      else n.target = { x: n.foodRef.x, y: n.foodRef.y };
    }
    // play: stick to a playmate while playing tag, and time the romp out
    if (n.mode === 'play') {
      if (n.playKind === 'tag' && n.chaseRef) {
        n.target = { x: n.chaseRef.x, y: n.chaseRef.y };
        if (Math.hypot(n.chaseRef.x-n.x, n.chaseRef.y-n.y) < 40) {
          n.flick = 1; blowBubbles(n, 3);      // caught you! happy bubbles
          n.mode = 'wander'; n.playT = 0; n.think = 0;
        }
      }
      n.playT -= dt;
      if (n.playT <= 0) { n.mode = 'wander'; n.think = 0; }
    }
    if (n.mode === 'air' && n.oxygen > 95) { n.mode = 'wander'; n.think = 0; }

    // steer toward the target (eases off as it arrives)
    const tgt = n.target || { x: n.x, y: n.y };
    const ddx = tgt.x-n.x, ddy = tgt.y-n.y;
    const dd = Math.hypot(ddx,ddy) || 1;
    const maxSpd = n.mode === 'food' ? 145
                 : n.mode === 'air'  ? 125
                 : n.mode === 'play' ? (n.playKind === 'dart' ? 235 : n.playKind === 'tag' ? 175 : 110)
                 : 72;
    const ease = Math.min(1, dd/70), k = Math.min(1, dt*2.4);
    n.vx += ((ddx/dd)*maxSpd*ease - n.vx) * k;
    n.vy += ((ddy/dd)*maxSpd*ease - n.vy) * k;
    n.x += n.vx*dt; n.y += n.vy*dt;
    n.x = Math.max(40, Math.min(W-40, n.x));
    n.y = Math.max(30, Math.min(H-40, n.y));

    n.angle = Math.atan2(n.vy, n.vx);
    const flickChance = n.mode === 'play' ? 0.03 : 0.006;
    if (Math.random() < flickChance) n.flick = 1; // playful gill/tail whip
    n.flick = Math.max(0, (n.flick||0) - dt*1.6);
    updateTwirl(n, dt);
    // every so often, a little puff of bubbles from the snout
    n.blowT -= dt;
    if (n.blowT <= 0) { n.blowT = 4 + Math.random()*8; blowBubbles(n, 2 + (Math.random()*2|0)); }
    const sp = Math.hypot(n.vx, n.vy);
    n.swim += (Math.min(1, sp/110) - n.swim) * Math.min(1, dt*7);
    n.gillPhase += dt * (3 + n.swim*14 + n.flick*9);
    n.tailPhase += dt * (2.5 + n.swim*16 + n.flick*16);

    // gobble up any food they bump into — including the toothless fish
    let nearFoodD = Infinity;
    for (let i = foods.length-1; i >= 0; i--) {
      const f = foods[i];
      const fd = Math.hypot(f.x-n.x, f.y-n.y);
      if (fd < nearFoodD) nearFoodD = fd;
      if (fd < 26) {
        foods.splice(i, 1);
        n.eaten = (n.eaten||0) + 1;
        addParticles(f.x, f.y, '#FFD700', 8);
        bite(n);
        // only a soft bite now and then, and only if you're nearby —
        // four axolotls nibbling at once shouldn't sound like chewing
        if (npcNearPlayer(n) && time - lastNpcEat > 0.45) { lastNpcEat = time; sNpcEat(); }
      }
    }
    for (let i = dangers.length-1; i >= 0; i--) {
      const s = dangers[i];
      if (!isSnackFish(s)) continue;
      const sd = Math.hypot(s.x-n.x, s.y-n.y);
      if (sd < nearFoodD) nearFoodD = sd;
      if (sd < s.r + 12) {
        dangers.splice(i, 1);
        n.eaten = (n.eaten||0) + 1;
        addParticles(s.x, s.y, '#FFD700', 10);
        bite(n);
        if (npcNearPlayer(n) && time - lastNpcEat > 0.45) { lastNpcEat = time; sNpcEat(); }
      }
    }
    updateMouth(n, nearFoodD, dt);
  });
  // keep the lake stocked (both the player and the others are eating now)
  while (foods.length < 7) spawnFood();
  if (factTimer>0) factTimer -= dt;
  factClock -= dt;
  if (factClock <= 0) {
    showFact();
    factClock = 120; // every 2 minutes from then on
  }
}

function drawAxolotl(a) {
  if (!a) a = ax;
  const {x,y,angle,limbs,gillPhase} = a;
  const swim = a.swim || 0, tailPhase = a.tailPhase || 0, flick = a.flick || 0;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle + (a.spin || 0));

  const PINK   = '#FFB6C1';   // body
  const PINK_D = '#E87FA8';   // far-side limbs (shaded, recede)
  const BELLY  = '#FFE1EA';   // pale underside
  const FIN    = '#FFC9D8';   // translucent fins
  const SPECK  = '#EF7CA6';   // mottled skin
  const LEGC   = '#FF8FB8';   // near-side limbs (in front)
  const GILL   = '#E91E63';
  const GILL_T = '#F06292';
  const MOUTH  = '#c2185b';

  // ---- far-side legs (behind the body) ----
  const leg = (cx, cy, sc, col) => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(cx, cy, 4.2*sc, 5.5*sc, 0, 0, Math.PI*2); ctx.fill();
    for (let i=-1;i<=1;i++){
      ctx.beginPath(); ctx.arc(cx + i*2.8*sc, cy + 5.2*sc, 1.7*sc, 0, Math.PI*2); ctx.fill();
    }
  };
  if (limbs.leftArm)  leg(10, 11.5, 0.8, PINK_D);
  if (limbs.rightArm) leg(-16, 11, 0.8, PINK_D);

  // ---- tail: hinged at the base, carrying its translucent caudal fin ----
  if (limbs.tail) {
    ctx.save();
    ctx.translate(-19, 0);
    ctx.rotate(Math.sin(tailPhase) * (0.03 + swim*0.12 + flick*0.16));
    // caudal fin (drawn first, so the tail flesh sits on top of it)
    ctx.globalAlpha = 0.55; ctx.fillStyle = FIN;
    ctx.beginPath();
    ctx.moveTo(3,-8);
    ctx.quadraticCurveTo(-12,-23, -26,-3);
    ctx.quadraticCurveTo(-30,0, -26,3);
    ctx.quadraticCurveTo(-12,22.5, 3,8);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    // tail flesh — tapers to the point of the original tail
    ctx.fillStyle = PINK;
    ctx.beginPath();
    ctx.moveTo(1,-9);
    ctx.quadraticCurveTo(-12,-8, -21,-2);
    ctx.quadraticCurveTo(-24,0, -21,2);
    ctx.quadraticCurveTo(-12,8, 1,9);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = SPECK;
    for (const s of [[-5,-3],[-11,1],[-5,3],[-16,-1],[-9,-1]]) {
      ctx.beginPath(); ctx.arc(s[0], s[1], 1.1, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  } else if (a.regenUntil>0) {
    // regrowing stub
    const t = 1 - a.regenUntil/5;
    ctx.fillStyle = PINK;
    ctx.beginPath();
    ctx.ellipse(-22, 0, 3+5*t, 3+3*t, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // ---- low dorsal ridge: continues the tail fin forward along the back ----
  if (limbs.tail) {
    ctx.globalAlpha = 0.4; ctx.fillStyle = FIN;
    ctx.beginPath();
    ctx.moveTo(6,-13.5);
    ctx.quadraticCurveTo(-6,-17, -21,-9);
    ctx.lineTo(-21,-5);
    ctx.quadraticCurveTo(-6,-12, 6,-11.5);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ---- body + head: one smooth axolotl silhouette ----
  // Long tubular body, broad flattened head, tapering to the tail base.
  const bodyPath = () => {
    ctx.beginPath();
    ctx.moveTo(42, 1);                          // snout tip
    ctx.quadraticCurveTo(41,-6, 31,-10.5);      // top of the snout
    ctx.quadraticCurveTo(20,-13, 8,-12.5);      // flat skull
    ctx.quadraticCurveTo(-5,-11.5, -21,-9);     // back, down to the tail base
    ctx.lineTo(-21, 9);                         // tail base (tucked under the tail)
    ctx.quadraticCurveTo(-5,13.5, 8,13.5);      // belly
    ctx.quadraticCurveTo(22,14.5, 29,11);       // chest to chin
    ctx.quadraticCurveTo(39,8, 42,1);           // lower snout
    ctx.closePath();
  };
  ctx.fillStyle = PINK;
  bodyPath(); ctx.fill();

  // Pale underside + mottled skin, clipped to the body so nothing spills off it.
  ctx.save();
  bodyPath(); ctx.clip();
  ctx.fillStyle = BELLY; ctx.fillRect(-60,-60,140,140);
  ctx.save(); ctx.translate(0,-5); ctx.fillStyle = PINK; bodyPath(); ctx.fill(); ctx.restore();
  ctx.fillStyle = SPECK;
  const seed = a.speck || 0;
  for (let i=0;i<SPECKLES.length;i++){
    const s = SPECKLES[i];
    const j1 = Math.sin(i*12.9898 + seed)*43758.5453;
    const j2 = Math.sin(i*78.233 + seed*1.7)*12543.12;
    const jx = (j1 - Math.floor(j1) - 0.5)*2.4, jy = (j2 - Math.floor(j2) - 0.5)*2.4;
    ctx.beginPath(); ctx.arc(s[0]+jx, s[1]+jy, s[2], 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // ---- near-side legs (in front of the body) ----
  if (limbs.leftArm) leg(16.5, 15.5, 1, LEGC);
  else if (a.regenUntil>0){ ctx.fillStyle=LEGC; ctx.beginPath(); ctx.arc(16.5,12.5,3.4,0,Math.PI*2); ctx.fill(); }
  if (limbs.rightArm) leg(-11.5, 14.5, 1, LEGC);
  else if (a.regenUntil>0){ ctx.fillStyle=LEGC; ctx.beginPath(); ctx.arc(-11.5,11.5,3.4,0,Math.PI*2); ctx.fill(); }

  // ---- mouth: a friendly smile on the snout, blooming into an open "O" for a
  // bite. Never any teeth, and it sits well clear of the eyes. ----
  const mouth = a.mouth || 0;
  const mx = 36.5, my = 1.8;
  if (mouth > 0.02) {
    const mw = 2.7 + mouth*0.85, mh = 1.3 + mouth*2.9;
    ctx.fillStyle = '#8E1B3C';                 // dark interior of the open mouth
    ctx.beginPath(); ctx.ellipse(mx, my, mw, mh, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = MOUTH; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(mx, my, mw, mh, 0, 0, Math.PI*2); ctx.stroke();
  } else {
    ctx.strokeStyle = MOUTH; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(mx, my, 3.6, 0.3, Math.PI-0.3); ctx.stroke();
  }

  // ---- gills: three short feathery, fringed stalks per side, rooted BEHIND the
  // head and fanning outward. They grow filaments like a real axolotl's, and
  // they flutter on the tips (strongest on the outer stalks) and trail back when
  // swimming — so no stalk ever crosses the eyes. ----
  const gAmp = 3 + swim*5 + flick*4;
  const sweep = swim*5 + flick*4;
  for (let side=-1; side<=1; side+=2) {
    for (let i=0;i<3;i++){
      const wave = Math.sin(gillPhase + i*0.9 + (side>0?0:1.2)) * gAmp * (0.45 + i*0.275);
      const rx = 16 - i*3,                   ry = side*11.5;
      const tx = 11.5 - i*5 - sweep*0.5,     ty = side*16.75 + wave*0.35;
      const cx = 13.75 - i*4 - sweep*0.25,   cy = side*14.5 + wave*0.22;
      ctx.strokeStyle = GILL; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(rx, ry); ctx.quadraticCurveTo(cx, cy, tx, ty); ctx.stroke();
      // feathery fringe along the outer edge of the stalk
      ctx.strokeStyle = GILL_T; ctx.lineWidth = 1.5;
      for (let k=1;k<=4;k++){
        const t = 0.18 + k*0.17, mt = 1-t;
        const px = mt*mt*rx + 2*mt*t*cx + t*t*tx;
        const py = mt*mt*ry + 2*mt*t*cy + t*t*ty;
        const dx = 2*(mt*(cx-rx) + t*(tx-cx)), dy = 2*(mt*(cy-ry) + t*(ty-cy));
        const L = Math.hypot(dx,dy) || 1;
        const nx = side*dy/L, ny = -side*dx/L;      // outward normal
        const fl = 2.6 - k*0.3;
        ctx.beginPath(); ctx.moveTo(px, py);
        ctx.lineTo(px + nx*fl + dx/L*fl*0.6, py + ny*fl + dy/L*fl*0.6);
        ctx.stroke();
      }
      ctx.fillStyle = GILL_T;
      ctx.beginPath(); ctx.arc(tx, ty, 2.3, 0, Math.PI*2); ctx.fill();
    }
  }

  // ---- eyes: small and bead-like, drawn last so nothing can cross them ----
  for (const ey of [-6, 4]) {
    ctx.fillStyle = '#141414';
    ctx.beginPath(); ctx.arc(27, ey, 3.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(28.1, ey-1.2, 1.1, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawFood(f) {
  if (f.type==='worm') {
    ctx.strokeStyle = '#B71C1C'; ctx.lineWidth=3;
    ctx.beginPath();
    // wiggly
    for (let i=0;i<8;i++){
      const a = (time*3 + i*0.6);
      const y = f.y + Math.sin(a)*3;
      if (i===0) ctx.moveTo(f.x + i*3, y); else ctx.lineTo(f.x + i*3, y);
    }
    ctx.stroke();
  } else if (f.type==='shrimp') {
    ctx.fillStyle = '#FFAB91';
    ctx.beginPath(); ctx.ellipse(f.x,f.y,9,5,Math.PI/4,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#E64A19'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(f.x-7,f.y); ctx.lineTo(f.x-12,f.y-3); ctx.stroke();
  } else {
    // insect
    ctx.fillStyle='#4CAF50';
    ctx.beginPath(); ctx.ellipse(f.x,f.y,6,5,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#2E7D32'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(f.x-8,f.y); ctx.lineTo(f.x+8,f.y); ctx.stroke();
  }
}

function drawFish(d) {
  const r = d.r;
  const flip = d.vx < 0 ? -1 : 1;
  const wag = Math.sin(time*6 + (d.wobble || 0)) * 0.35;
  ctx.save();
  ctx.translate(d.x, d.y);
  ctx.scale(flip, 1); // face the way it swims

  // tail fin (wags as it swims)
  ctx.save();
  ctx.translate(-r*0.85, 0);
  ctx.rotate(wag);
  ctx.fillStyle = d.fin;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(-r*0.5, -r*0.6, -r*0.9, -r*0.5);
  ctx.quadraticCurveTo(-r*0.55, 0, -r*0.9, r*0.5);
  ctx.quadraticCurveTo(-r*0.5, r*0.6, 0, 0);
  ctx.fill();
  ctx.restore();

  // dorsal fin (pokes up above the body)
  ctx.fillStyle = d.fin;
  ctx.beginPath();
  ctx.moveTo(-r*0.4, -r*0.3);
  ctx.quadraticCurveTo(0, -r*1.0, r*0.38, -r*0.28);
  ctx.quadraticCurveTo(0, -r*0.45, -r*0.4, -r*0.3);
  ctx.fill();

  // body
  ctx.fillStyle = d.body;
  ctx.beginPath();
  ctx.ellipse(0, 0, r, r*0.62, 0, 0, Math.PI*2);
  ctx.fill();

  // stripes, clipped to the body
  if (d.stripe) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r*0.62, 0, 0, Math.PI*2);
    ctx.clip();
    ctx.fillStyle = d.stripe;
    for (let i = 0; i < 3; i++) {
      const bx = -r*0.45 + i*r*0.55;
      ctx.beginPath();
      ctx.moveTo(bx - r*0.11, -r*0.7);
      ctx.lineTo(bx + r*0.11, -r*0.7);
      ctx.lineTo(bx + r*0.28, r*0.7);
      ctx.lineTo(bx + r*0.06, r*0.7);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // glossy highlight along the back
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath();
  ctx.ellipse(r*0.05, -r*0.24, r*0.68, r*0.2, 0, 0, Math.PI*2);
  ctx.fill();

  // pectoral fin, on top of the body
  ctx.save();
  ctx.translate(r*0.08, r*0.2);
  ctx.rotate(wag*1.6 + 0.35);
  ctx.fillStyle = d.fin;
  ctx.globalAlpha = 0.85;
  ctx.beginPath();
  ctx.ellipse(0, 0, r*0.34, r*0.16, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();

  // eye
  const ex = r*0.56, ey = -r*0.1, er = Math.max(3, r*0.17);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(ex + er*0.2, ey, er*0.58, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ex + er*0.45, ey - er*0.32, er*0.22, 0, Math.PI*2); ctx.fill();

  // mouth — toothless fish get a friendly smile; toothed fish show their fangs
  ctx.strokeStyle = 'rgba(0,0,0,0.45)';
  ctx.lineWidth = Math.max(1.5, r*0.05);
  ctx.beginPath();
  if (d.teeth) {
    ctx.arc(r*0.9, r*0.2, r*0.2, Math.PI*1.12, Math.PI*1.82);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    const nTeeth = Math.max(2, Math.round(r/14));
    for (let i = 0; i < nTeeth; i++) {
      const tx = r*0.6 + i*r*0.13;
      ctx.beginPath();
      ctx.moveTo(tx, r*0.02);
      ctx.lineTo(tx + r*0.08, r*0.02);
      ctx.lineTo(tx + r*0.04, r*0.2);
      ctx.closePath();
      ctx.fill();
    }
  } else {
    // a little upturned grin, so they read as friendly snacks
    ctx.arc(r*0.82, r*0.16, r*0.22, Math.PI*1.15, Math.PI*1.85);
    ctx.stroke();
  }
  ctx.restore();
}

function draw() {
  // deep water: brighter at the surface, sinking into darkness below
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0.00,'#37B3B4');
  grad.addColorStop(0.30,'#2094A6');
  grad.addColorStop(0.65,'#166E88');
  grad.addColorStop(1.00,'#0B3F58');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // --- far distance: haze band, lake-bed silhouette, tiny plants, drifting schools ---
  // distant lake bed
  ctx.fillStyle = 'rgba(26,84,96,0.55)';
  ctx.beginPath();
  ctx.moveTo(0,H);
  for (let x=0; x<=W; x+=60) {
    ctx.lineTo(x, H - 26 - Math.sin(x*0.006)*16 - Math.sin(x*0.017)*9);
  }
  ctx.lineTo(W,H);
  ctx.closePath();
  ctx.fill();

  // distant rounded boulders
  farRocks.forEach(rk => {
    ctx.fillStyle = 'rgba(22,72,86,0.5)';
    ctx.beginPath();
    ctx.ellipse(rk.x, rk.y, rk.r, rk.r*0.6, 0, Math.PI, Math.PI*2);
    ctx.fill();
  });

  // far plants — pale blue silhouettes, faded but still readable
  ctx.strokeStyle = 'rgba(130,215,200,0.38)';
  farPlants.forEach(p => {
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x, H);
    for (let i=0;i<7;i++){
      const yy = H - i*(p.h/7);
      const xx = p.x + Math.sin(time*0.5 + p.phase + i*0.6)*5;
      ctx.lineTo(xx, yy);
    }
    ctx.stroke();
  });

  // distant fish schools, faded by distance
  bgFish.forEach(f => {
    const a = 0.12 + f.depth*0.2;
    const flip = f.vx < 0 ? -1 : 1;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.scale(flip, 1);
    ctx.fillStyle = `rgba(150,228,215,${a})`;
    ctx.beginPath();
    ctx.ellipse(0,0, f.r, f.r*0.5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath(); // tail
    ctx.moveTo(-f.r*0.8,0);
    ctx.lineTo(-f.r*1.6, -f.r*0.5);
    ctx.lineTo(-f.r*1.6, f.r*0.5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  });

  // shafts of surface light, breathing slowly
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  rays.forEach(r => {
    const a = 0.05 + 0.045*Math.sin(time*0.5 + r.phase);
    const g = ctx.createLinearGradient(0,0,0,H*0.9);
    g.addColorStop(0, `rgba(200,252,242,${Math.max(0,a)})`);
    g.addColorStop(0.55, `rgba(180,242,235,${Math.max(0,a*0.5)})`);
    g.addColorStop(1, 'rgba(180,242,235,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(r.x, 0);
    ctx.lineTo(r.x + r.w, 0);
    ctx.lineTo(r.x + r.w*2.1 + r.lean*260, H*0.95);
    ctx.lineTo(r.x - r.w*0.5 + r.lean*260, H*0.95);
    ctx.closePath();
    ctx.fill();
  });
  ctx.restore();

  // far marine snow
  snowFar.forEach(s => {
    ctx.fillStyle = `rgba(205,245,238,${s.a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });

  // depth haze: things fade toward the deep, so distance reads as depth
  const haze = ctx.createLinearGradient(0,0,0,H);
  haze.addColorStop(0,'rgba(7,44,56,0)');
  haze.addColorStop(0.55,'rgba(7,44,56,0.12)');
  haze.addColorStop(1,'rgba(4,28,40,0.42)');
  ctx.fillStyle = haze;
  ctx.fillRect(0,0,W,H);

  // air zone at top
  const airGrad = ctx.createLinearGradient(0,0,0,60);
  airGrad.addColorStop(0,'rgba(173,216,230,0.9)');
  airGrad.addColorStop(1,'rgba(173,216,230,0)');
  ctx.fillStyle = airGrad;
  ctx.fillRect(0,0,W,60);
  // air label — left side of the air band so it never overlaps the centred title/hint
  ctx.fillStyle='rgba(255,255,255,0.8)';
  ctx.font='bold 13px "Comic Sans MS", Verdana';
  ctx.textAlign='left';
  ctx.fillText(W > 900 ? '▲ AIR — swim here to breathe' : '▲ AIR', 12, 30);

  // --- mid distance: teal plants ---
  midPlants.forEach(p => {
    ctx.strokeStyle = 'rgba(46,140,150,0.75)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p.x, H);
    for (let i=0;i<9;i++){
      const yy = H - i*(p.h/9);
      const xx = p.x + Math.sin(time*0.7 + p.phase + i*0.55)*7;
      ctx.lineTo(xx, yy);
    }
    ctx.stroke();
  });

  // --- near distance: the original bold plants ---
  plants.forEach(p => {
    ctx.strokeStyle = '#2E7D32'; ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(p.x, H);
    for (let i=0;i<10;i++){
      const yy = H - i* (p.h/10);
      const xx = p.x + Math.sin(time*0.8 + p.phase + i*0.5)*8;
      if (i===0) ctx.moveTo(p.x,H); else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
    // leaf
    ctx.fillStyle='#43A047';
    ctx.beginPath();
    ctx.ellipse(p.x + Math.sin(time*0.8+p.phase)*8, H-p.h, 12,6, Math.PI/4,0,Math.PI*2);
    ctx.fill();
  });

  // bubbles
  ctx.fillStyle='rgba(255,255,255,0.5)';
  bubbles.forEach(b=>{ctx.beginPath(); ctx.arc(b.x,b.y,b.s,0,Math.PI*2); ctx.fill();});

  // dangers — only fish swim in this lake now
  dangers.forEach(d => drawFish(d));

  // foods
  foods.forEach(drawFood);

  // proteins
  proteins.forEach(p => {
    const glow = 0.6+Math.sin(time*6)*0.4;
    ctx.fillStyle = `rgba(0,255,170,${glow})`;
    ctx.shadowColor='#00FFAA'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
  });

  // other axolotls
  npcs.forEach(n => drawAxolotl(n));
  // axolotl
  drawAxolotl();

  // particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  });

  // near marine snow, in front of everything — the closest layer
  snowNear.forEach(s => {
    ctx.fillStyle = `rgba(210,248,242,${s.a*0.9})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  });

  // HUD (pushed below the air band so it never sits under the centred title/hint)
  const hudY = W <= 640 ? 150 : 76;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(10,hudY,200,60);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 24px "Comic Sans MS", Verdana';
  ctx.fillText('Food: ' + score, 20, hudY+30);
  // oxygen bar
  ctx.fillStyle = '#444'; ctx.fillRect(20,hudY+42,180,10);
  const oc = ax.oxygen>50?'#4CAF50':ax.oxygen>25?'#FFC107':'#F44336';
  ctx.fillStyle = oc; ctx.fillRect(20,hudY+42, (ax.oxygen/100)*180, 10);
  ctx.fillStyle='#fff'; ctx.font='12px Verdana'; ctx.fillText('Oxygen',20,hudY+38);

  // regen prompt (drawn below the HUD panel so it never collides with the title/hint)
  if (ax.regenUntil > 0) {
    const msg = 'Ouch! Collect green sparkles to heal faster!  ·  Healing: ' + Math.ceil(ax.regenUntil) + 's';
    let fs = 20;
    ctx.font = 'bold ' + fs + 'px "Comic Sans MS", Verdana';
    while (fs > 11 && ctx.measureText(msg).width > W - 40) { fs--; ctx.font = 'bold ' + fs + 'px "Comic Sans MS", Verdana'; }
    const barH = fs + 20, ry = hudY + 74;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, ry, W, barH);
    ctx.fillStyle = '#FFEB3B';
    ctx.textAlign = 'center';
    ctx.fillText(msg, W/2, ry + barH/2 + fs*0.36);
    ctx.textAlign = 'left';
  }

  // fact overlay — shrinks to fit narrow screens
  if (factTimer > 0) {
    const fade = factTimer > 0.5 ? 1 : factTimer*2;
    ctx.fillStyle = `rgba(0,0,0,${0.6*fade})`;
    ctx.fillRect(0, H/2-60, W, 120);
    ctx.fillStyle = '#FFEB3B';
    ctx.textAlign='center';
    let fs = 26;
    ctx.font = 'bold ' + fs + 'px "Comic Sans MS", Verdana';
    while (fs > 12 && ctx.measureText(currentFact).width > W - 40) {
      fs--; ctx.font = 'bold ' + fs + 'px "Comic Sans MS", Verdana';
    }
    ctx.fillText(currentFact, W/2, H/2);
    ctx.textAlign='left';
  }

  // bottom hint (shrinks to fit narrow screens)
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.fillRect(0,H-28,W,28);
  const hintText = W <= 640
    ? 'Eat toothless fish · Dodge toothed fish · 1 = surface · 2 = dive'
    : 'Move to eat worms, shrimp, insects — and the friendly toothless fish! Dodge the fish with teeth. Press 1 to surface for air, 2 to dive to the lake bed. You cannot die - you regenerate!';
  ctx.fillStyle='#fff';
  let hs = 14;
  ctx.font = hs+'px Verdana';
  while (hs > 9 && ctx.measureText(hintText).width > W-24) { hs--; ctx.font = hs+'px Verdana'; }
  ctx.textAlign='center';
  ctx.fillText(hintText, W/2, H-10);
  ctx.textAlign='left';
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
